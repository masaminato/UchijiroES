<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フレーズカード</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f7f7f7;
    }

    .card {
      max-width: 900px;
      margin: 0 auto;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="card" onclick="playAudio('audio/01_ugamjabura.mp3')">
    <img src="images/01_ugamjabura.png" alt="うがみやぶらー">
  </div>

  <script>
    function playAudio(src) {
      const audio = new Audio(src);
      audio.play();
    }
  </script>

</body>
</html>
